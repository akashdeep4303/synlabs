# Gold relevant_sources are corpus-relative paths. A retrieved chunk is relevant
# iff its metadata.source is in that list. Gold answers are short strings for EM/F1.
k_default: 5
questions:
  - id: q01
    question: How much does the Growth plan cost per month and how many legal entities does it include?
    relevant_sources: [pricing.md]
    gold: "$199 per month and 25 legal entities"
  - id: q02
    question: Is NimbusLedger priced per seat or per entity?
    relevant_sources: [pricing.md]
    gold: "entity-based, not seat-based; unlimited seats"
  - id: q03
    question: How long are posted journals retained?
    relevant_sources: [data-retention.md]
    gold: "7 years from the posting date"
  - id: q04
    question: How long are draft invoices kept before purge?
    relevant_sources: [data-retention.md]
    gold: "90 days of inactivity"
  - id: q05
    question: When is sandbox data wiped?
    relevant_sources: [data-retention.md, backup-and-dr.pdf]
    gold: "every Sunday 00:00 UTC"
  - id: q06
    question: What is production RPO and RTO?
    relevant_sources: [data-retention.md, backup-and-dr.pdf]
    gold: "RPO 15 minutes, RTO 4 hours"
  - id: q07
    question: Which compliance certifications does NimbusLedger hold?
    relevant_sources: [security-and-sso.md]
    gold: "SOC 2 Type II and ISO 27001"
  - id: q08
    question: Which regions can a workspace be pinned to?
    relevant_sources: [security-and-sso.md]
    gold: "us-east-1 and eu-central-1"
  - id: q09
    question: Is SSO available on the Starter plan?
    relevant_sources: [security-and-sso.md]
    gold: "No. SAML 2.0 and OIDC are Growth and Scale only."
  - id: q10
    question: What is the period-close target after period end?
    relevant_sources: [close-process.md]
    gold: "T+2 two business days"
  - id: q11
    question: What is the maximum number of lines on a single journal entry?
    relevant_sources: [close-process.md, journal-limits.pdf]
    gold: "500 lines"
  - id: q12
    question: Can a workspace mix 4-4-5 and calendar months in the same entity?
    relevant_sources: [close-process.md]
    gold: "No, you cannot mix them in the same entity"
  - id: q13
    question: What is the invoice API rate limit per API key?
    relevant_sources: [api-invoices.html]
    gold: "120 requests per minute, burst of 20 concurrent"
  - id: q14
    question: How many times are webhooks retried and what is the initial backoff?
    relevant_sources: [api-invoices.html]
    gold: "8 times, exponential backoff starting at 4 seconds"
  - id: q15
    question: How many currencies are supported and where do FX rates come from?
    relevant_sources: [multi-currency.html]
    gold: "42 currencies, ECB 16:00 CET fix"
  - id: q16
    question: What is the P1 first-response SLA?
    relevant_sources: [support-sla.md]
    gold: "30 minutes"
  - id: q17
    question: What is the P3 first-response SLA?
    relevant_sources: [support-sla.md]
    gold: "next business day"
  - id: q18
    question: Does NimbusLedger support MOSS for EU VAT?
    relevant_sources: [pricing.md]
    gold: "No. OSS is supported; MOSS is not."
  - id: q19
    question: How long are audit logs retained?
    relevant_sources: [data-retention.md]
    gold: "18 months"
  - id: q20
    question: What color is the CEO's office?
    relevant_sources: []
    gold: "I don't have that information in the NimbusLedger docs."
    expect_refuse: true
  - id: q21
    question: Who won the 2019 World Cup?
    relevant_sources: []
    gold: "I don't have that information in the NimbusLedger docs."
    expect_refuse: true
  - id: q22
    question: Are custom roles available on Growth?
    relevant_sources: [security-and-sso.md]
    gold: "No. Custom roles are Scale-only."
